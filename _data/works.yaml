le_pli:
  title: le pli
  year: 2026
  materials: Acryl / Leinwand / Alu
  dimensions: 65,5 × 49 × 14,5 cm
  description: |
    „le pli“ – die Falte –, ein Relief v. 2026, stehen Titel Farbe Form und Raum in einer Wechselbeziehung zueinander.
    Verschiedene Standpunkte der aktiven, visuellen Wahrnehmung erzeugen unterschiedliche Bilder im Raum.
    Es entstehen Phänomene der Mehrdeutigkeit von Anschauung und Begriff.
  image: /static/images/le_pli.jpg
  alt: le pli, Acryl auf Leinwand

