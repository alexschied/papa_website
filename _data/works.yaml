le_pli:
  title: le pli
  year: 2026
  materials: Acryl / Leinwand / Alu
  dimensions: 65,5 × 49 × 14,5 cm
  description: |
    In „le pli“ – die Falte – stehen Titel Farbe Form und Raum in einer Wechselwirkung zueinander. Verschiedene Positionen der aktiven, visuellen Wahrnehmung erzeugen unterschiedliche Bilder im Raum. Es entstehen ästhetische Phänomene der Mehrdeutigkeit und Ambivalenz durch Kunst.
  image: /static/images/le_pli.jpg
  alt: le pli, Acryl auf Leinwand

