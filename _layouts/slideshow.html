---
layout: default
---
<div class="slideshow">

  <div class="slide-stage">
    {% for name in page.images %}
      {% assign match = site.static_files | where_exp: "f", "f.path contains page.image_folder" | where: "basename", name | first %}
      {% if match %}
        <a href="{{ site.baseurl }}/{{ name }}/" class="slide-link {% if forloop.first %}active{% endif %}">
          <img src="{{ match.path | relative_url }}"
               class="slide {% if forloop.first %}active{% endif %}"
               alt="{{ name }}">
        </a>
      {% endif %}
    {% endfor %}
  </div>

  <div class="slide-controls">
    <button class="prev" onclick="changeSlide(-1)" aria-label="Previous slide">‹</button>
    <button class="fullscreen-btn" onclick="toggleFullscreen()" aria-label="Toggle fullscreen">⛶</button>
    <button class="next" onclick="changeSlide(1)" aria-label="Next slide">›</button>
  </div>

  {% if content and content != "" %}
  <div class="slide-citation">
    {{ content }}
  </div>
  {% endif %}

</div>

<script>
  let current = 0;
  function changeSlide(dir) {
    const slides = document.querySelectorAll('.slide-link');
    slides[current].classList.remove('active');
    slides[current].querySelector('.slide').classList.remove('active');
    current = (current + dir + slides.length) % slides.length;
    slides[current].classList.add('active');
    slides[current].querySelector('.slide').classList.add('active');
  }
  function toggleFullscreen() {
    const ss = document.querySelector('.slideshow');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (ss.requestFullscreen || ss.webkitRequestFullscreen).call(ss);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }
</script>
