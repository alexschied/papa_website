# Build settings
theme: minima
plugins:
  - jekyll-feed

# Copy the Cloudflare Pages redirect rules into the build despite the leading underscore
include:
  - _redirects

# Keep repo housekeeping files and local references out of the deployed site
exclude:
  - LICENSE
  - Makefile
  - README.md
  - austellungen/test.md
  - "**/.DS_Store"

header_pages:
  - navigation/werke.md
  - navigation/about.md
  - navigation/jahrgange.md
